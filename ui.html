<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
    }
    #main-ui {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #settings-icon {
      cursor: pointer;
    }
    #settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    #settings-content {
      background-color: white;
      padding: 2rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <div id="main-ui">
    <div id="header">
      <h2>AI Image Generator</h2>
      <div id="settings-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-settings"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>
    <textarea id="prompt" rows="4" placeholder="Enter a prompt..."></textarea>
    <button id="generate-button">Generate</button>
  </div>

  <div id="settings-modal">
    <div id="settings-content">
      <h3>Settings</h3>
      <label for="provider-select">AI Provider:</label>
      <select id="provider-select">
        <option value="http://localhost:11434/api/generate">Ollama</option>
        <option value="custom">Custom</option>
      </select>
      <label for="api-url-input">API URL:</label>
      <input type="text" id="api-url-input" disabled>
      <div class="modal-buttons">
        <button id="close-button">Close</button>
        <button id="save-button">Save</button>
      </div>
    </div>
  </div>

  <script>
    const settingsIcon = document.getElementById('settings-icon');
    const settingsModal = document.getElementById('settings-modal');
    const closeButton = document.getElementById('close-button');
    const saveButton = document.getElementById('save-button');
    const providerSelect = document.getElementById('provider-select');
    const apiUrlInput = document.getElementById('api-url-input');
    const generateButton = document.getElementById('generate-button');
    const promptInput = document.getElementById('prompt');

    // Load saved settings on startup
    const savedApiUrl = localStorage.getItem('apiUrl');
    if (savedApiUrl) {
      apiUrlInput.value = savedApiUrl;
      // Set the dropdown to the correct value
      let providerFound = false;
      for (let i = 0; i < providerSelect.options.length; i++) {
        if (providerSelect.options[i].value === savedApiUrl) {
          providerSelect.selectedIndex = i;
          providerFound = true;
          break;
        }
      }
      if (!providerFound) {
        providerSelect.value = 'custom';
        apiUrlInput.disabled = false;
      }
    } else {
      // Default to Ollama
      apiUrlInput.value = providerSelect.value;
    }

    settingsIcon.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
    });

    closeButton.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    saveButton.addEventListener('click', () => {
      localStorage.setItem('apiUrl', apiUrlInput.value);
      settingsModal.style.display = 'none';
    });

    providerSelect.addEventListener('change', () => {
      if (providerSelect.value === 'custom') {
        apiUrlInput.disabled = false;
        apiUrlInput.value = '';
      } else {
        apiUrlInput.disabled = true;
        apiUrlInput.value = providerSelect.value;
      }
    });

    generateButton.addEventListener('click', () => {
      const prompt = promptInput.value;
      const apiUrl = apiUrlInput.value;
      parent.postMessage({ pluginMessage: { type: 'generate-image', prompt, apiUrl } }, '*');
    });
  </script>
</body>
</html>
